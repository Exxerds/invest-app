# ============================================================
#  Nginx config for the REVERSE PROXY server (the public one).
#  This is the only machine the internet ever sees.
#
#  Install:
#    sudo cp deploy/nginx-proxy.conf /etc/nginx/sites-available/oakhaven
#    sudo ln -s /etc/nginx/sites-available/oakhaven \
#               /etc/nginx/sites-enabled/oakhaven
#    sudo nginx -t && sudo systemctl reload nginx
#
#  BEFORE that: replace  BACKEND_VPS_IP  with the real IP of
#  your PrivateAlps VPS (the hidden one).
# ============================================================

upstream oakhaven_backend {
    # ──► ЗАМЕНИТЕ на IP вашего бэкенд-VPS (PrivateAlps)
    server BACKEND_VPS_IP:4000;
    keepalive 32;
}

# HTTP → HTTPS + ACME challenges for Let's Encrypt
server {
    listen 80;
    listen [::]:80;
    server_name oakhavenyield.com www.oakhavenyield.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name oakhavenyield.com www.oakhavenyield.com;

    # Let's Encrypt (created by: certbot --nginx -d oakhavenyield.com -d www.oakhavenyield.com)
    ssl_certificate     /etc/letsencrypt/live/oakhavenyield.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/oakhavenyield.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:SSL:10m;

    server_tokens off;

    # KYC documents travel as base64 JSON data-URLs:
    # an 8 MB file ≈ 11 MB body. Default nginx limit (1 MB) WOULD BREAK uploads.
    client_max_body_size 12m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml font/woff2;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        proxy_pass http://oakhaven_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Pass the real client identity to the app
        # (Express has `trust proxy` enabled and reads X-Forwarded-For)
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;

        # Friendly 502 while the backend restarts
        proxy_next_upstream error timeout http_502 http_503;
    }
}
