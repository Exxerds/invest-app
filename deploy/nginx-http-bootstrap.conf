# ============================================================
#  TEMPORARY bootstrap config — HTTP only, app + nginx on the
#  SAME server (Njalla VPS 15, single-server phase).
#
#  We start with plain HTTP because Let's Encrypt can only issue
#  a certificate AFTER DNS points here. certbot --nginx will
#  rewrite this file and add the HTTPS block automatically.
#  The full-featured config (gzip, security headers, separate
#  proxy machine) lives in deploy/nginx-proxy.conf — it becomes
#  relevant again when the backend moves to PrivateAlps.
#
#  Install:
#    cp deploy/nginx-http-bootstrap.conf /etc/nginx/sites-available/oakhaven
#    ln -s /etc/nginx/sites-available/oakhaven /etc/nginx/sites-enabled/
#    rm -f /etc/nginx/sites-enabled/default
#    nginx -t && systemctl reload nginx
# ============================================================

server {
    listen 80;
    listen [::]:80;
    server_name oakhavenyield.com www.oakhavenyield.com;

    # ACME challenge (certbot) — работает уже сейчас
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # KYC-документы идут base64 JSON (~11 МБ при файле 8 МБ)
    client_max_body_size 12m;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;

        proxy_next_upstream error timeout http_502 http_503;
    }
}
